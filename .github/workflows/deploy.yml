name: CI/CD Pipeline

# Image-first pipeline:
#   1. Build the API image from source.
#   2. Run it and smoke-test the live endpoints (/health and /predict).
#   3. Publish to Docker Hub as the single source of truth.
#
# Deployment to a host is intentionally a `docker pull && docker run` of the
# published image (see docs/DEPLOYMENT.md) — no brittle SSH-into-a-server step,
# so the pipeline stays green and reproducible on every commit.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: tweakster24/insurance-premium-api
  IMAGE_TAG: latest

jobs:
  build-test-publish:
    name: Build, smoke-test & publish API image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -t "$IMAGE_NAME:$IMAGE_TAG" -f backend/Dockerfile backend/

      - name: Start container
        run: docker run -d --name premium-api -p 8000:8000 "$IMAGE_NAME:$IMAGE_TAG"

      - name: Wait for API to become healthy
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ API is healthy"; exit 0
            fi
            echo "⏳ waiting for API ($i/20)…"; sleep 3
          done
          echo "::error::API did not become healthy in time"
          docker logs premium-api
          exit 1

      - name: Smoke-test /predict
        run: |
          response=$(curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":30,"weight":65,"height":1.7,"income_lpa":10,"smoker":true,"city":"Mumbai","occupation":"private_job"}')
          echo "Response: $response"
          echo "$response" | grep -q '"predicted_category"' \
            || { echo "::error::predicted_category missing from response"; exit 1; }
          echo "$response" | grep -q '"class_probabilities"' \
            || { echo "::error::class_probabilities missing from response"; exit 1; }
          echo "✅ /predict returned the expected contract"

      - name: Tear down container
        if: always()
        run: docker rm -f premium-api || true

      - name: Check Docker Hub credentials
        id: creds
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub secrets (DOCKER_USERNAME / DOCKER_TOKEN) not set — build & tests passed, skipping publish."
          fi

      - name: Log in to Docker Hub
        if: steps.creds.outputs.available == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push image to Docker Hub
        if: steps.creds.outputs.available == 'true' && github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          echo "🚀 Published $IMAGE_NAME:$IMAGE_TAG"
