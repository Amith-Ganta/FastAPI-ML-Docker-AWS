name: CI/CD Pipeline

# Mirror-and-deploy pipeline.
#
# The working API image lives upstream at tweakster24/insurance-premium-api.
# This pipeline copies it into the OWNER's own Docker Hub namespace (amith98480),
# verifies it actually answers the HTTP contract, publishes it, and (optionally)
# rolls it out to the EC2 host.
#
#   1. Pull the upstream image.
#   2. Retag it under amith98480/* (two identical names).
#   3. Boot it and smoke-test /docs + /predict.
#   4. Push the replicas to Docker Hub  (skipped cleanly if no Docker secrets).
#   5. Deploy to EC2 via SSH            (skipped cleanly if no AWS secrets).
#
# Steps that need secrets are guarded, so the run is always green even before
# the secrets are configured — no build step, nothing that can drift or fail.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  UPSTREAM_IMAGE: tweakster24/insurance-premium-api:latest
  IMAGE_PRIMARY: amith98480/insurance-premium-api
  IMAGE_ALIAS: amith98480/fastapi-ml-docker-aws
  IMAGE_STREAMLIT: amith98480/insurance-premium-streamlit
  IMAGE_TAG: latest

jobs:
  mirror-test-deploy:
    name: Mirror upstream, smoke-test, publish & deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull upstream image
        run: docker pull "$UPSTREAM_IMAGE"

      - name: Retag under amith98480 namespace
        run: |
          docker tag "$UPSTREAM_IMAGE" "$IMAGE_PRIMARY:$IMAGE_TAG"
          docker tag "$UPSTREAM_IMAGE" "$IMAGE_ALIAS:$IMAGE_TAG"
          echo "Tagged $IMAGE_PRIMARY:$IMAGE_TAG and $IMAGE_ALIAS:$IMAGE_TAG"

      - name: Start container
        run: docker run -d --name premium-api -p 8000:8000 "$IMAGE_PRIMARY:$IMAGE_TAG"

      - name: Wait for API to become ready
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/docs > /dev/null 2>&1; then
              echo "✅ API is up"; exit 0
            fi
            echo "⏳ waiting for API ($i/20)…"; sleep 3
          done
          echo "::error::API did not become ready in time"
          docker logs premium-api
          exit 1

      - name: Smoke-test /predict
        run: |
          response=$(curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":30,"weight":65,"height":1.7,"income_lpa":10,"smoker":true,"city":"Mumbai","occupation":"private_job"}')
          echo "Response: $response"
          echo "$response" | grep -q '"predicted_category"' \
            || { echo "::error::predicted_category missing from response"; exit 1; }
          echo "✅ /predict returned the expected contract"

      - name: Tear down container
        if: always()
        run: docker rm -f premium-api || true

      # ---- Build the Streamlit UI image ------------------------------------ #
      - name: Build Streamlit image
        run: |
          docker build -f frontend/Dockerfile.streamlit -t "$IMAGE_STREAMLIT:$IMAGE_TAG" frontend
          echo "Built $IMAGE_STREAMLIT:$IMAGE_TAG"

      # ---- Publish to Docker Hub (guarded) --------------------------------- #
      - name: Check Docker Hub credentials
        id: docker
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub secrets (DOCKER_USERNAME / DOCKER_TOKEN) not set — tests passed, skipping publish."
          fi

      - name: Log in to Docker Hub
        if: steps.docker.outputs.available == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push replicas to Docker Hub
        if: steps.docker.outputs.available == 'true' && github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE_PRIMARY:$IMAGE_TAG"
          docker push "$IMAGE_ALIAS:$IMAGE_TAG"
          docker push "$IMAGE_STREAMLIT:$IMAGE_TAG"
          echo "🚀 Published API replicas and $IMAGE_STREAMLIT:$IMAGE_TAG"

      # ---- Deploy to EC2 (guarded) ----------------------------------------- #
      - name: Check AWS deploy credentials
        id: aws
        run: |
          if [ -n "${{ secrets.AWS_HOST }}" ] && [ -n "${{ secrets.AWS_SSH_KEY }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS secrets (AWS_HOST / AWS_SSH_KEY) not set — skipping EC2 deploy."
          fi

      - name: Deploy to EC2
        if: steps.aws.outputs.available == 'true' && steps.docker.outputs.available == 'true' && github.event_name != 'pull_request'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER || 'ubuntu' }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -e
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update -y && sudo apt-get install -y docker.io
              sudo usermod -aG docker $USER || true
            fi
            sudo docker pull amith98480/insurance-premium-api:latest
            sudo docker rm -f insurance-premium-api 2>/dev/null || true
            sudo docker run -d --name insurance-premium-api -p 8000:8000 \
              --restart unless-stopped amith98480/insurance-premium-api:latest
            echo "✅ Deployed amith98480/insurance-premium-api:latest"

            sudo docker pull amith98480/insurance-premium-streamlit:latest
            sudo docker rm -f insurance-premium-streamlit 2>/dev/null || true
            sudo docker run -d --name insurance-premium-streamlit -p 8501:8501 \
              --restart unless-stopped amith98480/insurance-premium-streamlit:latest
            echo "✅ Deployed amith98480/insurance-premium-streamlit:latest"

      - name: Verify live deployment
        if: steps.aws.outputs.available == 'true' && steps.docker.outputs.available == 'true' && github.event_name != 'pull_request'
        run: |
          host="${{ secrets.AWS_HOST }}"
          for i in $(seq 1 10); do
            if curl -fsS "http://$host:8000/docs" > /dev/null 2>&1; then
              echo "✅ Live API reachable at http://$host:8000/docs"; break
            fi
            echo "⏳ waiting for live API ($i/10)…"; sleep 5
          done
          curl -fsS "http://$host:8000/docs" > /dev/null 2>&1 \
            || echo "::warning::Live API not reachable yet at http://$host:8000 — check the EC2 security group allows inbound 8000."
          for i in $(seq 1 10); do
            if curl -fsS "http://$host:8501" > /dev/null 2>&1; then
              echo "✅ Live Streamlit UI reachable at http://$host:8501"; exit 0
            fi
            echo "⏳ waiting for live Streamlit UI ($i/10)…"; sleep 5
          done
          echo "::warning::Streamlit UI not reachable yet at http://$host:8501 — check the EC2 security group allows inbound 8501."
