# Local / single-host stack.
#
# `api` is built straight from this repo's ./backend source — the same build the
# CI/CD pipeline runs and publishes as amith98480/insurance-premium-api:latest.
# Building locally guarantees local == CI == prod. To skip the build and run the
# published image instead, comment out `build:` and uncomment the `image:` line.
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # image: amith98480/insurance-premium-api:latest   # pull-and-run alternative
    ports:
      - "8000:8000"
    container_name: insurance-premium-api
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    container_name: streamlit-frontend
    depends_on:
      - api
    environment:
      - PYTHONUNBUFFERED=1
      # Point the UI at the compose `api` service rather than the deployed host.
      - API_URL=http://api:8000/predict
    restart: unless-stopped
